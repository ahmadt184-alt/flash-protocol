<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الخدمات الرقمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #6d28d9 100%);
      color: #f8fafc;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      padding: 25px;
    }
    header h1 {
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
    }
    header p {
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
    }
    .wallet-bar {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
    }
    .wallet-info span {
      color: #38bdf8;
      font-weight: 700;
    }
    .btn-connect {
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-connect:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
    }
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .pricing-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .pricing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .pricing-card.selected {
      border-color: #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
    }
    .token-amount {
      font-size: 16px;
      font-weight: 900;
      color: #f8fafc;
    }
    .price {
      font-size: 13px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 10px;
    }
    button.main-action-btn {
      width: 100%;
      padding: 1rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button.main-action-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
    }
    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.7);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      .pricing-grid {
        grid-template-columns: 1fr;
      }
      .btn-connect, .main-action-btn {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>منصة الخدمات الرقمية</h1>
      <p>اختر الباقة المناسبة ونفّذ بأمان</p>
    </header>

    <div class="wallet-bar">
      <div class="wallet-info">
        الحساب: <span id="walletStatus">غير متصل</span><br>
        الرصيد: <span id="tokenBalance">0.00</span>
      </div>
      <button class="btn-connect" onclick="connectWallet()">ربط المحفظة</button>
    </div>

    <div class="pricing-grid">
      <div class="pricing-card selected" onclick="selectPackage(100)">
        <div class="token-amount">1,000 توكن</div>
        <div class="price">100 وحدة</div>
      </div>
      <div class="pricing-card" onclick="selectPackage(300)">
        <div class="token-amount">10,000 توكن</div>
        <div class="price">300 وحدة</div>
      </div>
      <div class="pricing-card" onclick="selectPackage(500)">
        <div class="token-amount">50,000 توكن</div>
        <div class="price">500 وحدة</div>
      </div>
    </div>

    <button class="main-action-btn" onclick="executeTransaction()">تنفيذ المعاملة</button>
    <div id="status">بانتظار التنفيذ...</div>
  </div>

  <script>
    let selectedPrice = 100;

    function selectPackage(price) {
      selectedPrice = price;
      document.querySelectorAll('.pricing-card').forEach(card => card.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
    }

    async function connectWallet() {
      if (window.ethereum) {
        try {
          const provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send("eth_requestAccounts", []);
          const signer = provider.getSigner();
          const address = await signer.getAddress();
          document.getElementById("walletStatus").innerText = address;
          document.getElementById("status").innerText = "تم الاتصال بالمحفظة ✅";
        } catch (err) {
          document.getElementById("status").innerText = "فشل الاتصال: " + err.message;
        }
      } else {
        document.getElementById("status").innerText = "محفظة غير متوفرة. قم بتثبيت MetaMask.";
      }
    }

    async function executeTransaction() {
      document.getElementById("status").innerText = "جارٍ التنفيذ...";
      // هنا تضع منطق العقد الذكي الخاص بك
      setTimeout(() => {
        document.getElementById("status").innerText = "تم تنفيذ المعاملة بنجاح ✅";
      }, 2000);
    }
  </script>
</body>
</html>
