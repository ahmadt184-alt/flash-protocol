<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الخدمات الرقمية المتطورة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #6d28d9 100%);
      color: #f8fafc;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      padding: 35px;
      position: relative;
      overflow: hidden;
    }
    header h1 {
      font-size: 28px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    header p {
      color: #cbd5e1;
      font-size: 15px;
    }
    .wallet-bar {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 25px 0;
      backdrop-filter: blur(8px);
    }
    .wallet-info span {
      color: #38bdf8;
      font-weight: 700;
    }
    .btn-connect {
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-connect:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
    }
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .pricing-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(6px);
    }
    .pricing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .pricing-card.selected {
      border-color: #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
    }
    .token-amount {
      font-size: 16px;
      font-weight: 900;
      color: #f8fafc;
    }
    .price {
      font-size: 13px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 10px;
    }
    button.main-action-btn {
      width: 100%;
      padding: 1rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button.main-action-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
    }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }
    .modal-content {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
    }
    .wallet-option {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .wallet-option:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.7);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- نافذة اختيار المحفظة -->
  <div class="modal-overlay" id="walletModal">
    <div class="modal-content">
      <h3>اختر نوع المحفظة</h3>
      <button class="wallet-option" onclick="connectWallet('metamask')">🦊 MetaMask</button>
      <button class="wallet-option" onclick="connectWallet('trust')">🛡 Trust Wallet</button>
      <button class="wallet-option" onclick="closeWalletModal()">إلغاء</button>
    </div>
  </div>

  <!-- الحاوية الرئيسية -->
  <div class="container" id="mainContainer">
    <header>
      <h1>منصة الخدمات الرقمية المتطورة</h1>
      <p>اختر التوكن والباقة المناسبة للتنفيذ الآمن</p>
    </header>

    <div class="wallet-bar">
      <div class="wallet-info">
        الحساب: <span id="walletStatus">غير متصل</span><br>
        الرصيد: <span id="tokenBalance">0.00</span>
      </div>
      <button class="btn-connect" onclick="openWalletModal()">ربط المحفظة</button>
    </div>

    <div class="selector-group">
      <select id="tokenSelect" onchange="onTokenChanged()">
        <option value="" disabled selected>قم بربط المحفظة لعرض التوكنات</option>
      </select>
    </div>

    <div class="pricing-grid">
      <div class="pricing-card selected" id="card-0" onclick="selectPackage(0, 100)">
        <div class="token-amount">1,000 توكن</div>
        <div class="price" id="price-0">100 وحدة</div>
        <button style="width:100%; background:none; border:none; color:#38bdf8; font-size:11px; font-weight:bold; cursor:pointer;">اختيار</button>
      </div>
      <div class="pricing-card" id="card-1" onclick="selectPackage(1, 300)">
        <div class="token-amount">10,000 توكن</div>
        <div class="price" id="price-1">300 وحدة</div>
        <button style="width:100%; background:none; border:none; color:#38bdf8; font-size:11px; font-weight:bold; cursor:pointer;">اختيار</button>
